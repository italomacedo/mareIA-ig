name: Build IG & Publish to Pages

# Compila o Implementation Guide com a imagem oficial do HL7 FHIR IG Publisher
# (hl7fhir/ig-publisher-base) e publica o conteudo de output/ no GitHub Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissoes necessarias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy por vez ocorra (sem cancelar um em andamento)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hl7fhir/ig-publisher-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evitar "dubious ownership" do git dentro do container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Baixar o IG Publisher (publisher.jar)
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o publisher.jar
          ls -la publisher.jar

      - name: DIAG ambiente da imagem
        shell: bash
        run: |
          echo "== whoami =="; whoami
          echo "== login PATH =="; bash -lc 'echo $PATH' || true
          echo "== which (login) =="; bash -lc 'for b in sushi java node jekyll bundle npx npm; do printf "%s -> " $b; command -v $b || echo NAO; done' || true
          echo "== find sushi (sem filtro) =="; find / -name sushi 2>/dev/null | head
          echo "== find _genonce.sh =="; find / -name "_genonce.sh" 2>/dev/null | head
          echo "== ls /home =="; ls -la /home 2>/dev/null; ls -la /home/publisher 2>/dev/null
          echo "== /etc/profile.d =="; ls -la /etc/profile.d 2>/dev/null; cat /etc/profile.d/*.sh 2>/dev/null | head -60
          echo "== /root/.bashrc =="; cat /root/.bashrc 2>/dev/null | head -30
          exit 1

      - name: Falhar se houver erros de QA
        run: |
          if [ -f output/qa.txt ]; then
            echo "===== Resumo do QA ====="
            grep -iE "Errors:|Warnings:|Broken Links" output/qa.txt | head -5 || true
            errs=$(grep -m1 -oE "Errors: [0-9]+" output/qa.txt | grep -oE "[0-9]+" || echo 0)
            echo "Erros de QA: ${errs:-0}"
            if [ "${errs:-0}" -gt 0 ]; then
              echo "::error::IG Publisher reportou ${errs} erro(s) de QA. Veja output/qa.html no artefato."
              exit 1
            fi
          else
            echo "::warning::output/qa.txt nao encontrado; pulando verificacao de QA."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site (output/) como artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
